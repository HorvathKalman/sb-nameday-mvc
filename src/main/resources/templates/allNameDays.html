<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All name days</title>
</head>
<body>

<table>
    <tr>
        <th>Name day</th>
        <th>Date</th>
    </tr>
    <tr th:each="nameDay : ${nameDaySimpleDTO}">
        <td th:text="${nameDay.getName()}"></td>
        <td th:text="${nameDay.getDate()}"></td>
    </tr>
</table>

<h2>Modify name day</h2>
<form method="post" action="/changeDate">
    <label>Name:</label>
    <input type="text" name="name" placeholder="Write here the name">
    <br><br>
    <label>New date:</label>
    <input type="text" name="date" placeholder="Write here the date">
    <br><br>
    <button type="submit">Modify</button>
</form>

</body>
</html>
