<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All name days</title>
</head>
<body>
<table>
  <tr>
    <th>Name day</th>
    <th>Date</th>
  </tr>
  <tr th:each="nameDay : ${nameDaySimpleDTO}">
    <td th:text="${nameDay.getName()}"></td>
    <td th:text="${nameDay.getDate()}"></td>
  </tr>
</table>

</body>
</html>
